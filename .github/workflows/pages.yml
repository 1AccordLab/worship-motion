# 部署到 GitHub Pages：main → 網站根目錄（正式版）、develop → /dev/（開發版）；教學頁在各自的 guide/
# 任一分支有新的 commit 就把兩邊都重新打包，一起部署。develop 打包或檢查失敗時沿用正式版產物，不擋正式版
name: 部署

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: prod }
      - uses: actions/checkout@v4
        with: { ref: develop, path: dev }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 檢查 repo 規則
        run: cd prod && python3 tests/check_repo.py
      - name: 打包
        run: |
          OUT="詩歌影片編輯器.html"
          mkdir -p site/dev
          check() {
            grep -q 'id="wm-app"' "$1" && grep -q 'id="wm-skill"' "$1" \
              && [ "$(grep -o 'class="wm-scene"' "$1" | wc -l)" -eq 8 ] && ! grep -q '{{' "$1"
          }
          build() {
            (cd "$1" && python3 build.py) && check "$1/dist/$OUT" && cp "$1/dist/$OUT" "$2/index.html"
          }
          build prod site || { echo "::error::正式版打包或產物檢查失敗"; exit 1; }
          cp -r prod/guide site/guide
          if [ -f dev/build.py ] && (cd dev && python3 tests/check_repo.py) && build dev site/dev; then
            cp -r dev/guide site/dev/guide
          else
            echo "::warning::develop 打包或檢查失敗，/dev/ 沿用正式版"
            cp site/index.html site/dev/index.html; cp -r prod/guide site/dev/guide
          fi
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
